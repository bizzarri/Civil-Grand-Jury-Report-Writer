name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build and test engine, native app and MSI
        shell: pwsh
        run: ./source/build.ps1
      - name: Test native controls with synthetic content
        shell: pwsh
        run: |
          $qa = Join-Path $env:RUNNER_TEMP 'report-native-qa'
          $p = Start-Process -FilePath "$PWD/app/ReportInterview.exe" -ArgumentList @('--self-test', ('"' + $qa + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content "$qa/FAIL.txt" -ErrorAction SilentlyContinue
            throw 'Native application tests failed'
          }
          Get-Content "$qa/PASS.txt"
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          Copy-Item "$qa/PASS.txt", "$qa/*.png" -Destination test-results
      - name: Verify MSI database and actual embedded payload
        shell: pwsh
        run: |
          python ./source/verify_msi.py (Join-Path $env:RUNNER_TEMP 'report-msi-qa')
          if ($LASTEXITCODE -ne 0) { throw 'MSI verification failed' }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'report-msi-qa/verification.json') test-results/
      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path app/* -DestinationPath dist/ReportInterview-2.0.0-portable-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReportInterview-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-results
          path: test-results/*
          if-no-files-found: error
